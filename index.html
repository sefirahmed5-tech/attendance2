    margin-bottom: 10px;

}

.student-status-badge {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 12px;
    background: #e0e0e0;
    color: #666;
}

.student-status-badge.saved {
    background: #4caf50;
    color: white;
}

.student-status-badge.partial {
    background: #ff9800;
    color: white;
}

.options {
    display: flex;
    gap: 8px;
}

.opt-btn {

    padding: 10px 5px;

    background: white;

}

.opt-btn.permission.active {

.zikir-row {

.zikir-btn {

function getTodayStr() {

    const d = new Date();

    return d.getFullYear() + "-" +
        String(d.getMonth()+1).padStart(2,"0") + "-" +
        String(d.getDate()).padStart(2,"0");

}

    const n = parseInt(value,10);

    return isNaN(n) ? null : n;

    box.className =

function setBusy(button,busy,busyText,normalText) {

    if(!button) return;

    button.disabled = busy;

    button.textContent =
    busy ? busyText : normalText;

}


db.ref(".info/connected").on(
    "value",
    snapshot => {

        const online =
        snapshot.val() === true;

        const el =
        document.getElementById("syncStatus");

        el.className =
        "sync-status " +
        (online ? "online" : "offline");

        el.textContent =
        online ? "✅ Online" : "❌ Offline";

    }
);


function buildSurahOptions(selected) {

    return `
    <option value="">Select Surah</option>
    ` +

    SURAHS.map(s => {

        return `
        <option
        value="${s}"
        ${s === selected ? "selected" : ""}
        >
        ${s}
        </option>
        `;

    }).join("");

}


function buildPageOptions(selected) {

    return `
    <option value="">Select Page</option>
    ` +

    PAGES.map(p => {

        return `
        <option
        value="${p}"
        ${Number(selected) === p ? "selected" : ""}
        >
        Page ${p}
        </option>
        `;

    }).join("");

}


async function saveStudentAttendance(name,dateKey) {

    const stateKey =
    "attendance-" + name;

    if(savingState[stateKey])
        return;

    savingState[stateKey] = true;

    const button =
    document.getElementById(
        "saveAttBtn-" + name
    );

    setBusy(
        button,
        true,
        "Saving...",
        "💾 Save Attendance"
    );

    try {

        if(currentAttendance[name] === undefined) {

            showStatus(
                `⚠️ Please select a status for ${name} first`,
                "error"
            );

            return;

        }

        const ref =
        db.ref("attendance/" + dateKey);

        await ref.transaction(oldData => {

            oldData = oldData || {};

            oldData.records =
            oldData.records || {};

            oldData.weeklyZikir =
            oldData.weeklyZikir || {};

            oldData.records[name] =
            currentAttendance[name];

            oldData.weeklyZikir[name] =
            !!currentZikir[name];

            oldData.date =
            dateKey;

            oldData.updatedAt =
            firebase.database.ServerValue.TIMESTAMP;

            return oldData;

        });

        showStatus(
            `✅ ${name}'s attendance saved!`,
            "success"
        );

        await loadFromFirebase(dateKey);

        await loadHistory();

    }

    catch(error) {

        showStatus(
            "❌ Error saving: " + error.message,
            "error"
        );

    }

    finally {

        savingState[stateKey] = false;

        setBusy(
            button,
            false,
            "Saving...",
            "💾 Save Attendance"
        );

    }

}


function readPlan(name) {

    const currentSurah =
    document.getElementById(
        "currentSurah-" + name
    );

    const currentPage =
    document.getElementById(
        "currentPage-" + name
    );

    const targetSurah =
    document.getElementById(
        "targetSurah-" + name
    );

    const targetPage =
    document.getElementById(
        "targetPage-" + name
    );

    if(
        !currentSurah ||
        !currentPage ||
        !targetSurah ||
        !targetPage ||
        !currentSurah.value ||
        !currentPage.value ||
        !targetSurah.value ||
        !targetPage.value
    ) {

        return null;

    }

    const currentSurahNum =
    surahIndex(currentSurah.value);

    const targetSurahNum =
    surahIndex(targetSurah.value);

    const currentPageNum =
    Number(currentPage.value);

    const targetPageNum =
    Number(targetPage.value);

    if(
        !Number.isFinite(currentPageNum) ||
        !Number.isFinite(targetPageNum) ||
        currentSurahNum === null ||
        targetSurahNum === null
    ) {

        return null;

    }

    const movesForward =
    targetSurahNum > currentSurahNum ||
    (
        targetSurahNum === currentSurahNum &&
        targetPageNum > currentPageNum
    );

    if(!movesForward) {

        return {
            invalid: true
        };

    }

    return {

        currentSurah:
        currentSurah.value,

        currentPage:
        currentPageNum,

        targetSurah:
        targetSurah.value,

        targetPage:
        targetPageNum

    };

}


async function saveStudentQuranPlan(name) {

    const stateKey =
    "plan-" + name;

    if(savingState[stateKey])
        return;

    const plan =
    readPlan(name);

    const error =
    document.getElementById(
        "planError-" + name
    );

    if(!plan) {

        if(error) {

            error.textContent =
            "⚠️ Please complete all four fields.";

            error.classList.add("show");

        }

        showStatus(
            `⚠️ Please complete ${name}'s Quran plan`,
            "error"
        );

        return;

    }

    if(plan.invalid) {

        if(error) {

            error.textContent =
            "⚠️ Target position must be after current position.";

            error.classList.add("show");

        }

        showStatus(
            `⚠️ ${name}'s target must come after current position`,
            "error"
        );

        return;

    }

    if(error) {

        error.classList.remove("show");

        error.textContent = "";

    }

    savingState[stateKey] = true;

    const button =
    document.getElementById(
        "savePlanBtn-" + name
    );

    setBusy(
        button,
        true,
        "Saving...",
        "📖 Save Plan"
    );

    try {

        plan.updatedAt =
        firebase.database.ServerValue.TIMESTAMP;

        await db.ref(
            "quranPlans/" + name
        ).set(plan);

        currentQuranPlans[name] =
        plan;

        showStatus(
            `📖 ${name}'s Quran plan saved!`,
            "success"
        );

        renderStudents();

    }

    catch(error) {

        showStatus(
            "❌ Error saving plan: " +
            error.message,
            "error"
        );

    }

    finally {

        savingState[stateKey] = false;

        setBusy(
            button,
            false,
            "Saving...",
            "📖 Save Plan"
        );

    }

}


async function saveAllAttendance(dateKey) {

    if(savingState["all-attendance"])
        return;

    savingState["all-attendance"] = true;

    const button =
    document.getElementById("saveAllBtn");

    setBusy(
        button,
        true,
        "Saving...",
        "💾 Save All Attendance"
    );

    const missing =
    STUDENTS.filter(
        name =>
        currentAttendance[name] === undefined
    );

    if(missing.length > 0) {

        showStatus(
            "⚠️ Missing status for: " +
            missing.join(", "),
            "error"
        );

        savingState["all-attendance"] = false;

        setBusy(
            button,
            false,
            "Saving...",
            "💾 Save All Attendance"
        );

        return;

    }

    try {

        await db.ref(
            "attendance/" + dateKey
        ).transaction(oldData => {

            oldData = oldData || {};

            oldData.date =
            dateKey;

            oldData.records =
            oldData.records || {};

            oldData.weeklyZikir =
            oldData.weeklyZikir || {};

            STUDENTS.forEach(name => {

                oldData.records[name] =
                currentAttendance[name];

                oldData.weeklyZikir[name] =
                !!currentZikir[name];

            });

            oldData.updatedAt =
            firebase.database.ServerValue.TIMESTAMP;

            return oldData;

        });

        showStatus(
            "✅ All attendance saved!",
            "success"
        );

        await loadFromFirebase(dateKey);

        await loadHistory();

    }

    catch(error) {

        showStatus(
            "❌ Error saving: " +
            error.message,
            "error"

    }

    finally {

        savingState["all-attendance"] = false;

        setBusy(
            button,
            false,
            "Saving...",
            "💾 Save All Attendance"

async function saveAllQuranPlans() {

    if(savingState["all-plans"])
        return;

    savingState["all-plans"] = true;

    const button =
    document.getElementById(
        "saveAllPlansBtn"
    );

    setBusy(
        button,
        true,
        "Saving...",
        "📖 Save All Plans"
    );

    try {

        const updates = {};

        let saved = 0;

        const skipped = [];

        STUDENTS.forEach(name => {

            const plan =
            readPlan(name);

            if(!plan || plan.invalid) {

                skipped.push(name);

                return;

            }

            plan.updatedAt =
            firebase.database.ServerValue.TIMESTAMP;

            updates[
                "quranPlans/" + name
            ] = plan;

            saved++;

        });

        if(saved > 0) {

            await db.ref().update(updates);

        }

        await loadQuranPlans();

        renderStudents();

        if(saved === 0) {

            showStatus(
                "⚠️ No valid Quran plans to save",
                "error"
            );

        }

        else {

            showStatus(
                `✅ Saved ${saved} Quran plan(s)` +
                (
                    skipped.length
                    ? ". Skipped: " +
                      skipped.join(", ")
                    : "!"
                ),
                "success"
            );

        }

    }

    catch(error) {

        showStatus(
            "❌ Error saving plans: " +
            error.message,
            "error"
        );

    }

    finally {

        savingState["all-plans"] = false;

        setBusy(
            button,
            false,
            "Saving...",
            "📖 Save All Plans"
        );

    }

}


async function loadQuranPlans() {

    const snapshot =
    await db.ref(
        "quranPlans"
    ).once("value");

    currentQuranPlans =
    snapshot.val() || {};

}


async function loadFromFirebase(dateKey) {

    showStatus(
        "📥 Loading data...",
        "loading"
    );

    try {

        const snapshot =
        await db.ref(
            "attendance/" + dateKey
        ).once("value");

        const data =
        snapshot.val();

        if(data) {

            currentAttendance =
            data.records || {};

            currentZikir =
            data.weeklyZikir || {};

        }

        else {

            currentAttendance = {};

            currentZikir = {};

        }

        await loadQuranPlans();

        renderStudents();

        showStatus(
            `✅ Loaded data for ${dateKey}`,
            "success"
        );

    }

    catch(error) {

        showStatus(
            "❌ Error loading: " +
            error.message,
            "error"
        );

    }

}


async function loadHistory() {

    const list =
    document.getElementById(
        "historyList"
    );

    try {

        const snapshot =
        await db.ref(
            "attendance"
        ).once("value");

        const allData =
        snapshot.val();

        if(!allData) {

            list.innerHTML =
            '<div class="empty-msg">No records yet</div>';

            return;

        }

        list.innerHTML = "";

        const dates =
        Object.keys(allData)
        .sort((a,b) =>
            b.localeCompare(a)
        );

        dates.forEach(dateKey => {

            const records =
            allData[dateKey].records || {};

            const present =
            Object.values(records)
            .filter(
                status =>
                status === "present"
            ).length;

            const total =
            Object.keys(records).length;

            const item =
            document.createElement("div");

            item.className =
            "history-item";

            item.innerHTML = `
                <span class="date">
                    ${dateKey}
                </span>

                <span class="summary">
                    ${present}/${total} present
                </span>
            `;

            item.onclick = () => {

                document.getElementById(
                    "attDate"
                ).value = dateKey;

                loadFromFirebase(
                    dateKey
                );

            };

            list.appendChild(item);

        });

    }

    catch(error) {

        list.innerHTML =
        `<div class="empty-msg">
            Error: ${error.message}
        </div>`;

    }

}


function renderStudents() {

    const list =
    document.getElementById(
        "studentList"
    );

    if(isController) {

        list.innerHTML = "";

        return;

    }

    list.innerHTML = "";

    STUDENTS.forEach(name => {

        const plan =
        currentQuranPlans[name] || {};

        const hasAttendance =
        currentAttendance[name] !== undefined;

        const hasPlan =
        !!(
            plan.currentSurah &&
            plan.targetSurah
        );

        let badgeText =
        "Not saved";

        let badgeClass = "";

        if(
            hasAttendance &&
            hasPlan
        ) {

            badgeText =
            "✅ Complete";

            badgeClass =
            "saved";

        }

        else if(
            hasAttendance ||
            hasPlan
        ) {

            badgeText =
            "⏳ Partial";

            badgeClass =
            "partial";

        }

        const card =
        document.createElement("div");

        card.className =
        "student-card";

        card.innerHTML = `

        <div class="student-name">

            <span>
                ${name}
            </span>

            <span
            class="student-status-badge ${badgeClass}">
                ${badgeText}
            </span>

        </div>

        <div class="options">

        ${
            STATUS_OPTIONS.map(option => `

            <button
            class="opt-btn ${option.key}
            ${
                currentAttendance[name] ===
                option.key
                ? "active"
                : ""
            }"
            data-name="${name}"
            data-status="${option.key}"
            >

            ${option.label}

            </button>

            `).join("")
        }

        </div>

        <div class="zikir-row">

            <button
            class="zikir-btn
            ${
                currentZikir[name]
                ? "active"
                : ""
            }"
            data-name="${name}"
            >

            ${
                currentZikir[name]
                ? "🕌 Weekly Zikir: Done"
                : "🕌 Mark Weekly Zikir"
            }

            </button>

        </div>

        <div class="student-actions">

            <button
            class="save-student-btn attendance"
            id="saveAttBtn-${name}"
            data-name="${name}"
            >

            💾 Save Attendance

            </button>

        </div>

        <div class="quran-plan">

            <div class="quran-plan-title">
                📖 15-Day Quran Plan
            </div>

            <span class="plan-label">
                📍 Current Position
            </span>

            <div class="plan-row">

                <select
                id="currentSurah-${name}">
                    ${
                        buildSurahOptions(
                            plan.currentSurah
                        )
                    }
                </select>

                <select
                id="currentPage-${name}">
                    ${
                        buildPageOptions(
                            plan.currentPage
                        )
                    }
                </select>

            </div>

            <span class="plan-label">
                🎯 Target Position
            </span>

            <div class="plan-row">

                <select
                id="targetSurah-${name}">
                    ${
                        buildSurahOptions(
                            plan.targetSurah
                        )
                    }
                </select>

                <select
                id="targetPage-${name}">
                    ${
                        buildPageOptions(
                            plan.targetPage
                        )
                    }
                </select>

            </div>

            <div
            class="plan-error"
            id="planError-${name}">
            </div>

            <div class="student-actions">

                <button
                class="save-student-btn plan"
                id="savePlanBtn-${name}"
                data-name="${name}"
                >

                📖 Save Plan

                </button>

            </div>

        </div>

        `;

        list.appendChild(card);

    });


    document
    .querySelectorAll(".opt-btn")
    .forEach(button => {

        button.onclick = () => {

            currentAttendance[
                button.dataset.name
            ] =
            button.dataset.status;

            renderStudents();

        };

    });


    document
    .querySelectorAll(".zikir-btn")
    .forEach(button => {

        button.onclick = () => {

            const name =
            button.dataset.name;

            currentZikir[name] =
            !currentZikir[name];

            renderStudents();

        };

    });


    document
    .querySelectorAll(
        ".save-student-btn.attendance"
    )
    .forEach(button => {

        button.onclick = () => {

            saveStudentAttendance(
                button.dataset.name,
                document.getElementById(
                    "attDate"
                ).value
            );

        };

    });


    document
    .querySelectorAll(
        ".save-student-btn.plan"
    )
    .forEach(button => {

        button.onclick = () => {

            saveStudentQuranPlan(
                button.dataset.name
            );

        };

    });

}


function generateReport(dateKey) {

    let text =
    `📋 Attendance Report - ${dateKey}\n\n`;

    STUDENTS.forEach(name => {

        const plan =
        currentQuranPlans[name] || {};

        text +=
        `${name}: ` +
        `${currentAttendance[name] || "Not marked"} ` +
        `| Weekly Zikir: ` +
        `${currentZikir[name] ? "Done" : "Not done"}\n`;

        if(plan.currentSurah) {

            text +=
            `   📖 Quran: ` +
            `${plan.currentSurah}, page ${plan.currentPage}` +
            ` → ${plan.targetSurah}, page ${plan.targetPage}\n`;

        }

        text += "\n";

    });

    return text;

}


async function sendToController() {

    const dateKey =
    document.getElementById(
        "attDate"
    ).value;

    const missing =
    STUDENTS.filter(
        name =>
        currentAttendance[name] === undefined
    );

    if(missing.length > 0) {

        showStatus(
            "⚠️ Mark attendance first for: " +
            missing.join(", "),
            "error"
        );

        return;

    }

    const button =
    document.getElementById(
        "sendControllerBtn"
    );

    setBusy(
        button,
        true,
        "Sending...",
        "📨 Send to Controller"
    );

    try {

        const report = {

            date:
            dateKey,

            attendance:
            {...currentAttendance},

            weeklyZikir:
            {...currentZikir},

            quranPlans:
            JSON.parse(
                JSON.stringify(
                    currentQuranPlans
                )
            ),

            reportText:
            generateReport(dateKey),

            sentAt:
            firebase.database.ServerValue.TIMESTAMP

        };

        const newReportRef =
        db.ref(
            "controllerReports"
        ).push();

        await newReportRef.set(
            report
        );

        showStatus(
            "✅ Report sent to Controller successfully!",
            "success"
        );

    }

    catch(error) {

        showStatus(
            "❌ Could not send report: " +
            error.message,
            "error"
        );

    }

    finally {

        setBusy(
            button,
            false,
            "Sending...",
            "📨 Send to Controller"
        );

    }

}


async function loadControllerReports() {

    const list =
    document.getElementById(
        "controllerList"
    );

    try {

        const snapshot =
        await db.ref(
            "controllerReports"
        ).once("value");

        const allReports =
        snapshot.val();

        if(!allReports) {

            list.innerHTML =
            '<div class="empty-msg">No reports received yet.</div>';

            return;

        }

        list.innerHTML = "";

        const reports =
        Object.entries(allReports)
        .sort(
            (a,b) =>
            (b[1].sentAt || 0) -
            (a[1].sentAt || 0)
        );

        reports.forEach(
            ([reportId,report]) => {

            const card =
            document.createElement(
                "div"
            );

            card.className =
            "controller-card";

            let html = `

            <div class="controller-date">

                📅 ${report.date || "Unknown date"}

            </div>

            <div class="controller-meta">

                📨 Received by Controller

            </div>

            `;

            STUDENTS.forEach(name => {

                const plan =
                report.quranPlans &&
                report.quranPlans[name];

                html += `

                <div class="report-line">

                    <b>${name}</b>:

                    ${
                        report.attendance &&
                        report.attendance[name]
                        ?
                        report.attendance[name]
                        :
                        "Not marked"
                    }

                    |

                    Zikir:

                    ${
                        report.weeklyZikir &&
                        report.weeklyZikir[name]
                        ?
                        "Done"
                        :
                        "Not done"
                    }

                `;

                if(plan &&
                   plan.currentSurah) {

                    html += `

                    <br>

                    📖
                    ${plan.currentSurah}
                    page ${plan.currentPage}

                    →

                    ${plan.targetSurah}
                    page ${plan.targetPage}

                    `;

                }

                html += `</div>`;

            });

            html += `

            <button
            class="delete-report"
            data-id="${reportId}"
            >

            🗑️ Delete This Report

            </button>

            `;

            card.innerHTML =
            html;

            list.appendChild(card);

        });


        document
        .querySelectorAll(
            ".delete-report"
        )
        .forEach(button => {

            button.onclick = async () => {

                const id =
                button.dataset.id;

                if(
                    !confirm(
                        "Delete this report?"
                    )
                ) return;

                try {

                    await db.ref(
                        "controllerReports/" +
                        id
                    ).remove();

                    showStatus(
                        "🗑️ Report deleted.",
                        "success"
                    );

                    await loadControllerReports();

                }

                catch(error) {

                    showStatus(
                        "❌ Delete failed: " +
                        error.message,
                        "error"
                    );

                }

            };

        });

    }

    catch(error) {

        list.innerHTML =
        `<div class="empty-msg">
            Error: ${error.message}
        </div>`;

    }

}


document.addEventListener(
"DOMContentLoaded",
async () => {

    if(isController) {

        document.getElementById(
            "pageTitle"
        ).textContent =
        "📨 Controller Dashboard";

        document.getElementById(
            "pageSubtitle"
        ).textContent =
        "View attendance and Quran reports sent to the controller";

        document.getElementById(
            "mainActions"
        ).style.display =
        "none";

        document.getElementById(
            "studentList"
        ).style.display =
        "none";

        document.getElementById(
            "historySection"
        ).style.display =
        "none";

        document.getElementById(
            "controllerSection"
        ).style.display =
        "block";

        document.getElementById(
            "attDate"
        ).style.display =
        "none";

        document.querySelector(
            ".date-section label"
        ).style.display =
        "none";

        await loadControllerReports();

        return;

    }


    const dateInput =
    document.getElementById(
        "attDate"
    );

    dateInput.value =
    getTodayStr();

    await loadFromFirebase(
        dateInput.value
    );

    await loadHistory();


    dateInput.onchange =
    () => {

        loadFromFirebase(
            dateInput.value
        );

    };


    document.getElementById(
        "saveAllBtn"
    ).onclick =
    () => {

        saveAllAttendance(
            dateInput.value
        );

    };


    document.getElementById(
        "saveAllPlansBtn"
    ).onclick =
    saveAllQuranPlans;


    document.getElementById(
        "loadBtn"
    ).onclick =
    () => {

        loadFromFirebase(
            dateInput.value
        );

    };


    document.getElementById(
        "shareBtn"
    ).onclick =
    async () => {

        const text =
        generateReport(
            dateInput.value
        );

        if(navigator.share) {

            try {

                await navigator.share({
                    title:
                    "Attendance Report",
                    text:
                    text
                });

            }

            catch(error) {}

        }

        else {

            try {

                await navigator.clipboard
                .writeText(text);

                showStatus(
                    "📋 Report copied to clipboard!",
                    "success"
                );

            }

            catch(error) {

                showStatus(
                    "⚠️ Could not copy report.",
                    "error"
                );

            }

        }

    };


    document.getElementById(
        "sendControllerBtn"
    ).onclick =
    sendToController;

});

</script>
