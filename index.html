</head>

const PAGES = Array.from({ length: 48 }, (_, i) => i + 1);

let currentAttendance = {};
let currentZikir = {};
let currentQuranPlans = {};

const savingState = {};

function getTodayStr() {
    const d = new Date();
    return d.getFullYear() + "-" +
        String(d.getMonth() + 1).padStart(2, "0") + "-" +
        String(d.getDate()).padStart(2, "0");
}

function surahIndex(surahLabel) {
    const n = parseInt(surahLabel, 10);
    return isNaN(n) ? null : n;
}

function showStatus(message, type = "info") {
    const msg = document.getElementById("statusMsg");
    msg.className = "status-msg " + type;
    msg.textContent = message;
}

function updateSyncStatus(online) {
    const el = document.getElementById("syncStatus");
    el.className = "sync-status " + (online ? "online" : "offline");
    el.textContent = online ? "✅ Online" : "❌ Offline";
}

async function checkConnection() {
    try {
        await db.ref(".info/connected").once("value");
        updateSyncStatus(true);
        return true;
    } catch (e) {
        updateSyncStatus(false);
        return false;
    }
}

function setButtonBusy(btn, busy, busyLabel, normalLabel) {
    if (!btn) return;
    btn.disabled = busy;
    btn.textContent = busy ? busyLabel : normalLabel;
}

async function saveStudentAttendance(name, dateKey) {
    const stateKey = "att-" + name;
    if (savingState[stateKey]) return;
    savingState[stateKey] = true;

    const btn = document.getElementById("saveAttBtn-" + name);
    setButtonBusy(btn, true, "Saving...", "💾 Save Attendance");

    try {
        if (currentAttendance[name] === undefined) {
            showStatus(`⚠️ Please select a status for ${name} first`, "error");
            return;
        }

        const snapshot = await db.ref("attendance/" + dateKey).once("value");
        const existingData = snapshot.val() || {};

        const updatedRecords = existingData.records || {};
        updatedRecords[name] = currentAttendance[name];

        const updatedZikir = existingData.weeklyZikir || {};
        updatedZikir[name] = currentZikir[name] || false;

        await db.ref("attendance/" + dateKey).set({
            date: dateKey,
            records: updatedRecords,
            weeklyZikir: updatedZikir,
            timestamp: firebase.database.ServerValue.TIMESTAMP
        });

        showStatus(`✅ ${name}'s attendance saved!`, "success");
        renderStudents();
        await loadHistory();

    } catch (e) {
        showStatus(`❌ Error saving ${name}: ${e.message}`, "error");
    } finally {
        savingState[stateKey] = false;
        setButtonBusy(btn, false, "Saving...", "💾 Save Attendance");
    }
}

async function saveStudentQuranPlan(name) {
    const stateKey = "plan-" + name;
    if (savingState[stateKey]) return;

    const currentSurah = document.getElementById("currentSurah-" + name);
    const currentPage = document.getElementById("currentPage-" + name);
    const targetSurah = document.getElementById("targetSurah-" + name);
    const targetPage = document.getElementById("targetPage-" + name);
    const errorEl = document.getElementById("planError-" + name);

    if (!currentSurah || !currentPage || !targetSurah || !targetPage) {
        showStatus(`⚠️ Please complete all fields for ${name}`, "error");
        return;
    }

    if (!currentSurah.value || !targetSurah.value || !currentPage.value || !targetPage.value) {
        showStatus(`⚠️ Please select Surah and Page for ${name}`, "error");
        return;
    }

    const curSurahNum = surahIndex(currentSurah.value);
    const tgtSurahNum = surahIndex(targetSurah.value);
    const curPageNum = Number(currentPage.value);
    const tgtPageNum = Number(targetPage.value);

    if (isNaN(curPageNum) || isNaN(tgtPageNum)) {
        showStatus(`⚠️ Page values must be numbers for ${name}`, "error");
        return;
    }

    const movesForward =
        tgtSurahNum > curSurahNum ||
        (tgtSurahNum === curSurahNum && tgtPageNum > curPageNum);

    if (!movesForward) {
        if (errorEl) {
            errorEl.textContent = "⚠️ Target position must be after the current position";
            errorEl.classList.add("show");
        }
        showStatus(`⚠️ ${name}'s target must come after their current position`, "error");
        return;
    } else if (errorEl) {
        errorEl.classList.remove("show");
        errorEl.textContent = "";
    }

    savingState[stateKey] = true;
    const btn = document.getElementById("savePlanBtn-" + name);
    setButtonBusy(btn, true, "Saving...", "📖 Save Plan");

    const plan = {
        currentSurah: currentSurah.value,
        currentPage: curPageNum,
        targetSurah: targetSurah.value,
        targetPage: tgtPageNum,
        updatedAt: firebase.database.ServerValue.TIMESTAMP
    };

    try {
        await db.ref("quranPlans/" + name).set(plan);
        currentQuranPlans[name] = plan;
        showStatus(`📖 ${name}'s Quran plan saved!`, "success");
        renderStudents();
    } catch (e) {
        showStatus(`❌ Error saving ${name}'s plan: ${e.message}`, "error");
    } finally {
        savingState[stateKey] = false;
        setButtonBusy(btn, false, "Saving...", "📖 Save Plan");
    }
}

async function saveAllAttendance(dateKey) {
    const stateKey = "att-all";
    if (savingState[stateKey]) return;
    savingState[stateKey] = true;

    const btn = document.getElementById("saveAllBtn");
    setButtonBusy(btn, true, "Saving...", "💾 Save All Attendance");

    const missing = STUDENTS.filter(name => currentAttendance[name] === undefined);
    if (missing.length > 0) {
        showStatus(`⚠️ Missing status for: ${missing.join(", ")}`, "error");
        savingState[stateKey] = false;
        setButtonBusy(btn, false, "Saving...", "💾 Save All Attendance");
        return false;
    }

    try {
        await db.ref("attendance/" + dateKey).set({
            date: dateKey,
            records: currentAttendance,
            weeklyZikir: currentZikir,
            timestamp: firebase.database.ServerValue.TIMESTAMP
        });

        showStatus("✅ All attendance saved!", "success");
        renderStudents();
        await loadHistory();
        return true;

    } catch (e) {
        showStatus("❌ Error saving: " + e.message, "error");
        return false;

    } finally {
        savingState[stateKey] = false;
        setButtonBusy(btn, false, "Saving...", "💾 Save All Attendance");
    }
}

async function saveAllQuranPlans() {
    const stateKey = "plan-all";
    if (savingState[stateKey]) return;
    savingState[stateKey] = true;

    const btn = document.getElementById("saveAllPlansBtn");
    setButtonBusy(btn, true, "Saving...", "📖 Save All Plans");
    showStatus("💾 Saving all Quran plans...", "loading");

    try {
        let savedCount = 0;
        const skipped = [];

        for (const name of STUDENTS) {
            const currentSurah = document.getElementById("currentSurah-" + name);
            const currentPage = document.getElementById("currentPage-" + name);
            const targetSurah = document.getElementById("targetSurah-" + name);
            const targetPage = document.getElementById("targetPage-" + name);

            if (!currentSurah || !currentSurah.value || !targetSurah || !targetSurah.value ||
                !currentPage.value || !targetPage.value) {
                skipped.push(name);
                continue;
            }

            const curSurahNum = surahIndex(currentSurah.value);
            const tgtSurahNum = surahIndex(targetSurah.value);
            const curPageNum = Number(currentPage.value);
            const tgtPageNum = Number(targetPage.value);

            if (isNaN(curPageNum) || isNaN(tgtPageNum)) {
                skipped.push(name);
                continue;
            }

            const movesForward =
                tgtSurahNum > curSurahNum ||
                (tgtSurahNum === curSurahNum && tgtPageNum > curPageNum);

            if (!movesForward) {
                skipped.push(name);
                continue;
            }

            await db.ref("quranPlans/" + name).set({
                currentSurah: currentSurah.value,
                currentPage: curPageNum,
                targetSurah: targetSurah.value,
                targetPage: tgtPageNum,
                updatedAt: firebase.database.ServerValue.TIMESTAMP
            });
            savedCount++;
        }

        if (savedCount === 0) {
            showStatus("⚠️ No complete/valid plans to save", "error");
        } else if (skipped.length > 0) {
            showStatus(`✅ Saved ${savedCount} plans. Skipped (incomplete/invalid): ${skipped.join(", ")}`, "info");
        } else {
            showStatus(`✅ Saved ${savedCount} Quran plans!`, "success");
        }

        await loadQuranPlans();
        renderStudents();

    } catch (e) {
        showStatus("❌ Error saving plans: " + e.message, "error");
    } finally {
        savingState[stateKey] = false;
        setButtonBusy(btn, false, "Saving...", "📖 Save All Plans");
    }
}

async function loadFromFirebase(dateKey) {
    showStatus("📥 Loading data...", "loading");

    try {
        const snapshot = await db.ref("attendance/" + dateKey).once("value");
        const data = snapshot.val();

        if (data && data.records) {
            currentAttendance = data.records;
            currentZikir = data.weeklyZikir || {};
        } else {
            currentAttendance = {};
            currentZikir = {};
        }

        await loadQuranPlans();

        renderStudents();
        showStatus(`✅ Loaded data for ${dateKey}`, "success");
        return true;

    } catch (e) {
        showStatus("❌ Error loading: " + e.message, "error");
        return false;
    }
}

async function loadQuranPlans() {
    try {
        const snapshot = await db.ref("quranPlans").once("value");
        currentQuranPlans = snapshot.val() || {};
    } catch (e) {
        console.error(e);
    }
}

async function loadHistory() {
    const historyList = document.getElementById("historyList");

    try {
        const snapshot = await db.ref("attendance").once("value");
        const allData = snapshot.val();

        if (!allData) {
            historyList.innerHTML = '<div class="empty-msg">No records yet</div>';
            return;
        }

        const dates = Object.keys(allData).sort((a, b) => b.localeCompare(a));

        historyList.innerHTML = "";
        dates.forEach(dateKey => {
            const entry = allData[dateKey];
            const records = entry.records || {};
            const presentCount = Object.values(records).filter(s => s === "present").length;
            const total = Object.keys(records).length;

            const item = document.createElement("div");
            item.className = "history-item";
            item.innerHTML = `
                <span class="date">${dateKey}</span>
                <span class="summary">${presentCount}/${total} present</span>
            `;
            item.addEventListener("click", () => {
                document.getElementById("attDate").value = dateKey;
                loadFromFirebase(dateKey);
            });
            historyList.appendChild(item);
        });

    } catch (e) {
        historyList.innerHTML = `<div class="empty-msg">Error loading history: ${e.message}</div>`;
    }
}

function buildSurahOptions(selectedValue) {
    let html = '<option value="">Select Surah</option>';
    SURAHS.forEach(s => {
        const sel = s === selectedValue ? "selected" : "";
        html += `<option value="${s}" ${sel}>${s}</option>`;
    });
    return html;
}

function buildPageOptions(selectedValue) {
    let html = '<option value="">Select Page</option>';
    PAGES.forEach(p => {
        const sel = Number(selectedValue) === p ? "selected" : "";
        html += `<option value="${p}" ${sel}>Page ${p}</option>`;
    });
    return html;
}

function renderStudents() {
    const list = document.getElementById("studentList");
    list.innerHTML = "";

    STUDENTS.forEach(name => {
        const plan = currentQuranPlans[name] || {};
        const hasAttendance = currentAttendance[name] !== undefined;
        const hasPlan = plan.currentSurah && plan.targetSurah;

        let badgeText = "Not saved";
        let badgeClass = "";
        if (hasAttendance && hasPlan) {
            badgeText = "✅ Complete";
            badgeClass = "saved";
        } else if (hasAttendance || hasPlan) {
            badgeText = "⏳ Partial";
            badgeClass = "partial";
        }

        const card = document.createElement("div");
        card.className = "student-card";

        card.innerHTML = `
            <div class="student-name">
                <span>${name}</span>
                <span class="student-status-badge ${badgeClass}">${badgeText}</span>
            </div>

            <div class="options">
                ${STATUS_OPTIONS.map(opt => `
                    <button
                        class="opt-btn ${opt.key} ${currentAttendance[name] === opt.key ? "active" : ""}"
                        data-name="${name}"
                        data-status="${opt.key}"
                    >${opt.label}</button>
                `).join("")}
            </div>

            <div class="zikir-row">
                <button class="zikir-btn ${currentZikir[name] ? "active" : ""}" data-name="${name}">
                    ${currentZikir[name] ? "🕌 Weekly Zikir: Done" : "🕌 Mark Weekly Zikir"}
                </button>
            </div>

            <div class="student-actions">
                <button class="save-student-btn attendance" id="saveAttBtn-${name}" data-name="${name}">
                    💾 Save Attendance
                </button>
            </div>

            <div class="quran-plan">
                <div class="quran-plan-title">📖 15-Day Quran Plan</div>

                <span class="plan-label">📍 Current Position</span>
                <div class="plan-row">
                    <select id="currentSurah-${name}">${buildSurahOptions(plan.currentSurah)}</select>
                    <select id="currentPage-${name}">${buildPageOptions(plan.currentPage)}</select>
                </div>

                <span class="plan-label">🎯 Target Position</span>
                <div class="plan-row">
                    <select id="targetSurah-${name}">${buildSurahOptions(plan.targetSurah)}</select>
                    <select id="targetPage-${name}">${buildPageOptions(plan.targetPage)}</select>
                </div>

                <div class="plan-error" id="planError-${name}"></div>

                <div class="student-actions">
                    <button class="save-student-btn plan" id="savePlanBtn-${name}" data-name="${name}">
                        📖 Save Plan
                    </button>
                </div>
            </div>
        `;

        list.appendChild(card);
    });

    attachStudentEventListeners();
}

function attachStudentEventListeners() {
    document.querySelectorAll(".opt-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            const name = btn.dataset.name;
            const status = btn.dataset.status;
            currentAttendance[name] = status;
            renderStudents();
        });
    });

    document.querySelectorAll(".zikir-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            const name = btn.dataset.name;
            currentZikir[name] = !currentZikir[name];
            renderStudents();
        });
    });

    document.querySelectorAll(".save-student-btn.attendance").forEach(btn => {
        btn.addEventListener("click", () => {
            const name = btn.dataset.name;
            const dateKey = document.getElementById("attDate").value || getTodayStr();
            saveStudentAttendance(name, dateKey);
        });
    });

    document.querySelectorAll(".save-student-btn.plan").forEach(btn => {
        btn.addEventListener("click", () => {
            const name = btn.dataset.name;
            saveStudentQuranPlan(name);
        });
    });
}

function generateReportText(dateKey) {
    let text = `📋 Attendance Report - ${dateKey}\n\n`;
    STUDENTS.forEach(name => {
        const status = currentAttendance[name] || "Not marked";
        const zikir = currentZikir[name] ? "Done" : "Not done";
        text += `${name}: ${status} | Weekly Zikir: ${zikir}\n`;
    });
    return text;
}

document.addEventListener("DOMContentLoaded", async () => {
    const dateInput = document.getElementById("attDate");
    dateInput.value = getTodayStr();

    await checkConnection();
    await loadFromFirebase(dateInput.value);
    await loadHistory();

    dateInput.addEventListener("change", () => {
        loadFromFirebase(dateInput.value);
    });

    document.getElementById("saveAllBtn").addEventListener("click", () => {
        saveAllAttendance(dateInput.value);
    });

    document.getElementById("saveAllPlansBtn").addEventListener("click", () => {
        saveAllQuranPlans();
    });

    document.getElementById("loadBtn").addEventListener("click", () => {
        loadFromFirebase(dateInput.value);
    });

    document.getElementById("shareBtn").addEventListener("click", () => {
        const text = generateReportText(dateInput.value);
        if (navigator.share) {
            navigator.share({ title: "Attendance Report", text });
        } else {
            navigator.clipboard.writeText(text).then(() => {
                showStatus("📋 Report copied to clipboard!", "success");
            }).catch(() => {
                showStatus("⚠️ Could not copy report automatically. Please copy manually.", "error");
            });
        }
    });
});
</script>
