function getTodayStr(){
  const d = new Date();

  return d.getFullYear() + "-" +
    String(d.getMonth()+1).padStart(2,"0") + "-" +
    String(d.getDate()).padStart(2,"0");
}

function escapeHtml(value){
  return String(value ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );
}

function showStatus(message,type="info"){
  const box = document.getElementById("statusMsg");

  box.className = "status-msg " + type;
  box.textContent = message;
}

function setBusy(button,busy,busyText,normalText){
  if(!button) return;

  button.disabled = busy;
  button.textContent =
    busy ? busyText : normalText;
}

function surahIndex(value){
  const n = parseInt(value,10);

  return Number.isNaN(n) ? null : n;
}

function faslById(id){
  return KITAB_FASLS[Number(id)-1] || null;
}

function buildSurahOptions(selected){

  return '<option value="">Select surah</option>' +

    SURAHS.map((s,i) =>
      '<option value="' +
      escapeHtml(s) +
      '" ' +
      (s === selected ? "selected" : "") +
      '>' +
      escapeHtml(s) +
      '</option>'
    ).join("");
}

function buildPageOptions(selected){

  return '<option value="">Page</option>' +

    PAGES.map(p =>
      '<option value="' +
      p +
      '" ' +
      (Number(selected) === p ? "selected" : "") +
      '>' +
      p +
      '</option>'
    ).join("");
}

function buildFaslOptions(selected){

  return '<option value="">Select Fasl</option>' +

    KITAB_FASLS.map((fasl,index) => {

      const number = index + 1;

      return '<option value="' +
        number +
        '" ' +
        (Number(selected) === number ? "selected" : "") +
        '>' +
        number +
        ". " +
        escapeHtml(fasl) +
        '</option>';

    }).join("");
}

function readQuranPlan(name){

  const currentSurah =
    document.getElementById("currentSurah-"+name);

  const currentPage =
    document.getElementById("currentPage-"+name);

  const targetSurah =
    document.getElementById("targetSurah-"+name);

  const targetPage =
    document.getElementById("targetPage-"+name);

  if(
    !currentSurah ||
    !currentPage ||
    !targetSurah ||
    !targetPage ||
    !currentSurah.value ||
    !currentPage.value ||
    !targetSurah.value ||
    !targetPage.value
  ){
    return null;
  }

  const cs = surahIndex(currentSurah.value);
  const ts = surahIndex(targetSurah.value);

  const cp = Number(currentPage.value);
  const tp = Number(targetPage.value);

  if(
    cs === null ||
    ts === null ||
    !Number.isFinite(cp) ||
    !Number.isFinite(tp)
  ){
    return null;
  }

  if(
    ts < cs ||
    (ts === cs && tp <= cp)
  ){
    return {invalid:true};
  }

  return {
    currentSurah: currentSurah.value,
    currentPage: cp,
    targetSurah: targetSurah.value,
    targetPage: tp
  };
}

async function saveStudentQuranPlan(name){

  const key = "quran-" + name;

  if(savingState[key]) return;

  const plan = readQuranPlan(name);

  const error =
    document.getElementById("planError-"+name);

  if(!plan){

    if(error){
      error.textContent =
        "⚠️ Please complete all four fields.";

      error.classList.add("show");
    }

    showStatus(
      "⚠️ Please complete " +
      name +
      "'s Quran plan",
      "error"
    );

    return;
  }

  if(plan.invalid){

    if(error){
      error.textContent =
        "⚠️ Target position must be after current position.";

      error.classList.add("show");
    }

    showStatus(
      "⚠️ " +
      name +
      "'s target must come after current position",
      "error"
    );

    return;
  }

  if(error){
    error.classList.remove("show");
  }

  savingState[key] = true;

  const btn =
    document.getElementById("savePlanBtn-"+name);

  setBusy(
    btn,
    true,
    "Saving...",
    "📖 Save Quran Plan"
  );

  try{

    plan.updatedAt =
      firebase.database.ServerValue.TIMESTAMP;

    await db
      .ref("quranPlans/"+name)
      .set(plan);

    currentQuranPlans[name] = plan;

    showStatus(
      "📖 " +
      name +
      "'s Quran plan saved!",
      "success"
    );

    renderStudents();

  }catch(e){

    showStatus(
      "❌ Error saving Quran plan: " +
      e.message,
      "error"
    );

  }finally{

    savingState[key] = false;

    setBusy(
      btn,
      false,
      "Saving...",
      "📖 Save Quran Plan"
    );
  }
}

async function saveArefatKitabPlan(){

  const initial =
    Number(
      document.getElementById("kitabInitial").value
    );

  const final =
    Number(
      document.getElementById("kitabFinal").value
    );

  const error =
    document.getElementById("kitabError");

  if(!initial || !final){

    error.textContent =
      "⚠️ Please select both the initial and final Fasl.";

    error.classList.add("show");

    showStatus(
      "⚠️ Complete Arefat's Kitab plan first",
      "error"
    );

    return;
  }

  if(final < initial){

    error.textContent =
      "⚠️ Final Fasl must be the same as or after the initial Fasl.";

    error.classList.add("show");

    showStatus(
      "⚠️ Final Fasl must be after the initial Fasl",
      "error"
    );

    return;
  }

  error.classList.remove("show");

  const btn =
    document.getElementById("saveKitabBtn");

  setBusy(
    btn,
    true,
    "Saving...",
    "📚 Save Kitab Plan"
  );

  try{

    const data = {

      initialFasl: initial,

      initialFaslName:
        faslById(initial),

      finalFasl: final,

      finalFaslName:
        faslById(final),

      updatedAt:
        firebase.database.ServerValue.TIMESTAMP
    };

    await db
      .ref("kitabPlans/Arefat")
      .set(data);

    currentKitabPlans.Arefat = data;

    showStatus(
      "📚 Arefat's Kitab plan saved!",
      "success"
    );

    renderStudents();

  }catch(e){

    );

  }finally{

    setBusy(
      btn,
      false,
      "Saving...",
      "📚 Save Kitab Plan"
    );
  }
}

async function saveAllQuranPlans(){

    document.getElementById("saveAllPlansBtn");

  setBusy(
    btn,
    true,
    "Saving...",
    "📖 Save All Quran Plans"
  );

  let saved = 0;
  let skipped = [];

  try{

    for(const name of STUDENTS){

      const plan =
        readQuranPlan(name);

      if(
        !plan ||
        plan.invalid
      ){

        skipped.push(name);
        continue;
      }

      plan.updatedAt =
        firebase.database.ServerValue.TIMESTAMP;

      await db
        .ref("quranPlans/"+name)
        .set(plan);

      currentQuranPlans[name] = plan;

      saved++;
    }

    showStatus(
      "✅ Saved " +
      saved +
      " Quran plan(s)." +
      (
        skipped.length
          ? " Skipped: " + skipped.join(", ")
          : ""
      ),
      "success"
    );

    renderStudents();

  }catch(e){

    showStatus(
      "❌ Error saving Quran plans: " +
      e.message,
      "error"
    );

  }finally{

    setBusy(
      btn,
      false,
      "Saving...",
      "📖 Save All Quran Plans"
    );
  }
}

async function loadQuranPlans(){

  const snap =
    await db
      .ref("quranPlans")
      .once("value");

  currentQuranPlans =
    snap.val() || {};
}

async function loadKitabPlans(){

  const snap =
    await db
      .ref("kitabPlans")
      .once("value");

  currentKitabPlans =
    snap.val() || {};
}

async function loadFromFirebase(dateKey){

  showStatus(
    "📥 Loading data...",
    "loading"
  );

  try{

    const snap =
      await db
        .ref("attendance/"+dateKey)
        .once("value");

    const data = snap.val();

    currentAttendance =
      data?.records || {};

    currentZikir =
      data?.weeklyZikir || {};

    await Promise.all([
      loadQuranPlans(),
      loadKitabPlans()
    ]);

    renderStudents();

    showStatus(
      "✅ Loaded data for " +
      dateKey,
      "success"
    );

  }catch(e){

    showStatus(
      "❌ Error loading: " +
      e.message,
      "error"
    );
  }
}

async function loadHistory(){

  const list =
    document.getElementById("historyList");

  try{

    const snap =
      await db
        .ref("attendance")
        .once("value");

    const all = snap.val();

    if(!all){

      list.innerHTML =
        '<div class="empty-msg">No records yet</div>';

      return;
    }

    list.innerHTML = "";

    Object.keys(all)
      .sort((a,b)=>b.localeCompare(a))
      .forEach(dateKey => {

        const records =
          all[dateKey]?.records || {};

        const present =
          Object.values(records)
            .filter(v=>v==="present")
            .length;

        const total =
          Object.keys(records).length;

        const item =
          document.createElement("div");

        item.className =
          "history-item";

        item.innerHTML =
          "<span><b>" +
          escapeHtml(dateKey) +
          "</b></span>" +

          "<span>" +
          present +
          "/" +
          total +
          " present</span>";

        item.onclick = () => {

          document.getElementById("attDate").value =
            dateKey;

          loadFromFirebase(dateKey);
        };

        list.appendChild(item);
      });

  }catch(e){

    list.innerHTML =
      '<div class="empty-msg">Error: ' +
      escapeHtml(e.message) +
      '</div>';
  }
}function quranSummary(plan){

  if(!plan?.currentSurah)
    return "";

  return "📖 Quran: " +
    plan.currentSurah +
    ", page " +
    plan.currentPage +
    " → " +
    plan.targetSurah +
    ", page " +
    plan.targetPage;
}

function kitabSummary(plan){

  if(!plan?.initialFasl)
    return "";

  return "📚 Kitab: Fasl " +
    plan.initialFasl +
    " (" +
    plan.initialFaslName +
    ") → Fasl " +
    plan.finalFasl +
    " (" +
    plan.finalFaslName +
    ")";
}

function renderStudents(){

  const list =
    document.getElementById("studentList");

  list.innerHTML = "";

  if(isController)
    return;

  STUDENTS.forEach(name => {

    const plan =
      currentQuranPlans[name] || {};

    const hasAttendance =
      currentAttendance[name] !== undefined;

    const hasQuran =
      !!(
        plan.currentSurah &&
        plan.targetSurah
      );

    const kitab =
      name === "Arefat"
        ? (currentKitabPlans.Arefat || {})
        : null;

    const hasKitab =
      name === "Arefat" &&
      !!(
        kitab.initialFasl &&
        kitab.finalFasl
      );

    const complete =
      name === "Arefat"
        ? (
            hasAttendance &&
            hasQuran &&
            hasKitab
          )
        : (
            hasAttendance &&
            hasQuran
          );

    const partial =
      hasAttendance ||
      hasQuran ||
      hasKitab;

    const card =
      document.createElement("div");

    card.className =
      "student-card";

    card.innerHTML = `

      <div class="student-name">

        <span>
          ${escapeHtml(name)}
        </span>

        <span class="student-status-badge
          ${
            complete
              ? "saved"
              : partial
                ? "partial"
                : ""
          }">

          ${
            complete
              ? "✅ Complete"
              : partial
                ? "⏳ Partial"
                : "Not saved"
          }

        </span>

      </div>


      <div class="options">

        ${STATUS_OPTIONS.map(o => `

          <button

            class="opt-btn
              ${o.key}
              ${
                currentAttendance[name] === o.key
                  ? "active"
                  : ""
              }"

            data-name="${escapeHtml(name)}"

            data-status="${o.key}"

          >
            ${o.label}
          </button>

        `).join("")}

      </div>


      <button

        class="zikir-btn
          ${
            currentZikir[name]
              ? "active"
              : ""
          }"

        style="margin-top:8px;width:100%"

      >

        ${
          currentZikir[name]
            ? "✅ Weekly Dhikr: Done"
            : "⭕ Weekly Dhikr: Not Done"
        }

      </button>


      <div class="plan">

        <div class="plan-title">
          📖 15-Day Quran Plan
        </div>


        <div class="plan-row">

          <div>

            <label>
              Initial Surah
            </label>

            <select
              id="currentSurah-${escapeHtml(name)}"
            >

              ${buildSurahOptions(
                plan.currentSurah
              )}

            </select>

          </div>


          <div>

            <label>
              Initial Page
            </label>

            <select
              id="currentPage-${escapeHtml(name)}"
            >

              ${buildPageOptions(
                plan.currentPage
              )}

            </select>

          </div>

        </div>


        <div class="plan-row">

          <div>

            <label>
              Final Surah
            </label>

            <select
              id="targetSurah-${escapeHtml(name)}"
            >

              ${buildSurahOptions(
                plan.targetSurah
              )}

            </select>

          </div>


          <div>

            <label>
              Final Page
            </label>

            <select
              id="targetPage-${escapeHtml(name)}"
            >

              ${buildPageOptions(
                plan.targetPage
              )}

            </select>

          </div>

        </div>


        <div
          class="plan-error"
          id="planError-${escapeHtml(name)}"
        ></div>


        <div class="student-actions">

          <button
            class="save-student-btn attendance-save
              save-attendance-one"
          >
            💾 Save Attendance
          </button>


          <button
            class="save-student-btn plan-save"
            id="savePlanBtn-${escapeHtml(name)}"
          >
            📖 Save Quran Plan
          </button>

        </div>

      </div>


      ${
        name === "Arefat"

        ? `

        <div class="kitab-plan">

          <div class="plan-title kitab-title">

            📚 15-Day Kitab Plan —
            Safinat an-Naja

          </div>


          <label>
            Initial Fasl
          </label>

          <select id="kitabInitial">

            ${buildFaslOptions(
              kitab.initialFasl
            )}

          </select>


          <label>
            Final Fasl
          </label>

          <select id="kitabFinal">

            ${buildFaslOptions(
              kitab.finalFasl
            )}

          </select>


          <div
            class="plan-error"
            id="kitabError"
          ></div>


          <div class="student-actions">

            <button
              class="save-student-btn kitab-save"
              id="saveKitabBtn"
            >
              📚 Save Kitab Plan
            </button>

          </div>

        </div>

        `

        : ""

      }

    `;


    card
      .querySelectorAll(".opt-btn")
      .forEach(btn => {

        btn.onclick = () => {

          currentAttendance[name] =
            btn.dataset.status;

          renderStudents();

        };

      });


    card
      .querySelector(".zikir-btn")
      .onclick = () => {

        currentZikir[name] =
          !currentZikir[name];

        renderStudents();

      };


    card
      .querySelector(".save-attendance-one")
      .onclick = async () => {

        const dateKey =
          document.getElementById("attDate").value;

        if(!dateKey){

          showStatus(
            "⚠️ Select a date first",
            "error"
          );

          return;
        }

        try{

          await db
            .ref("attendance/"+dateKey)
            .set({

              records:{
                ...currentAttendance
              },

              weeklyZikir:{
                ...currentZikir
              },

              updatedAt:
                firebase.database.ServerValue.TIMESTAMP

            });

          showStatus(
            "✅ " +
            name +
            "'s attendance saved",
            "success"
          );

          loadHistory();

        }catch(e){

          showStatus(
            "❌ Error saving attendance: " +
            e.message,
            "error"
          );

        }

      };


    card
      .querySelector(".plan-save")
      .onclick = () =>
        saveStudentQuranPlan(name);


    if(name === "Arefat"){

      card
        .querySelector("#saveKitabBtn")
        .onclick =
          saveArefatKitabPlan;

    }


    list.appendChild(card);

  });

}


function generateReport(dateKey){

  let text =
    "📋 Attendance Report - " +
    dateKey +
    "\n\n";


  STUDENTS.forEach(name => {

    text +=
      name +
      ": " +
      (
        currentAttendance[name] ||
        "Not marked"
      ) +
      " | Weekly Dhikr: " +
      (
        currentZikir[name]
          ? "Done"
          : "Not done"
      ) +
      "\n";


    const qp =
      currentQuranPlans[name];


    if(qp?.currentSurah){

      text +=
        "   " +
        quranSummary(qp) +
        "\n";

    }


    if(name === "Arefat"){

      const kp =
        currentKitabPlans.Arefat;


      if(kp?.initialFasl){

        text +=
          "   " +
          kitabSummary(kp) +
          "\n";

      }

    }


    text += "\n";

  });


  return text;
}


async function shareReport(){

  const dateKey =
    document.getElementById("attDate").value;

  const text =
    generateReport(dateKey);


  try{

    if(navigator.share){

      await navigator.share({

        title:
          "Attendance Report - " +
          dateKey,

        text:text

      });

    }else{

      await navigator.clipboard
        .writeText(text);

      showStatus(
        "📋 Report copied to clipboard",
        "success"
      );

      return;

    }


    showStatus(
      "✅ Report shared",
      "success"
    );


  }catch(e){

    if(e.name !== "AbortError"){

      showStatus(
        "❌ Could not share report: " +
        e.message,
        "error"
      );

    }

  }

}


async function sendToController(){

  const dateKey =
    document.getElementById("attDate").value;


  if(!dateKey){

    showStatus(
      "⚠️ Select a date first",
      "error"
    );

    return;
  }


  const missing =
    STUDENTS.filter(
      name =>
        currentAttendance[name] === undefined
    );


  if(missing.length){

    showStatus(
      "⚠️ Mark attendance first for: " +
      missing.join(", "),
      "error"
    );

    return;
  }


  const btn =
    document.getElementById(
      "sendControllerBtn"
    );


  setBusy(
    btn,
    true,
    "Sending...",
    "📨 Send to Controller"
  );


  try{

    const report = {

      date:dateKey,

      attendance:{
        ...currentAttendance
      },

      weeklyZikir:{
        ...currentZikir
      },

      quranPlans:
        JSON.parse(
          JSON.stringify(
            currentQuranPlans
          )
        ),

      kitabPlans:
        JSON.parse(
          JSON.stringify(
            currentKitabPlans
          )
        ),

      reportText:
        generateReport(dateKey),

      sentAt:
        firebase.database.ServerValue.TIMESTAMP

    };


    await db
      .ref("controllerReports")
      .push()
      .set(report);


    showStatus(
      "✅ Report sent to Controller successfully!",
      "success"
    );


  }catch(e){

    showStatus(
      "❌ Could not send report: " +
      e.message,
      "error"
    );


  }finally{

    setBusy(
      btn,
      false,
      "Sending...",
      "📨 Send to Controller"
    );

  }

}


async function loadControllerReports(){

  const list =
    document.getElementById(
      "controllerList"
    );


  try{

    const snap =
      await db
        .ref("controllerReports")
        .once("value");


    const all =
      snap.val();


    if(!all){

      list.innerHTML =
        '<div class="empty-msg">' +
        'No reports received yet.' +
        '</div>';

      return;

    }


    list.innerHTML = "";


    Object.entries(all)

      .sort(
        (a,b) =>
          (b[1].sentAt || 0) -
          (a[1].sentAt || 0)
      )

      .forEach(
        ([id,report]) => {

          const card =
            document.createElement(
              "div"
            );


          card.className =
            "controller-card";


          let html =

            '<div class="report-meta">' +

            "📅 " +

            escapeHtml(
              report.date ||
              "Unknown date"
            ) +

            "</div>";


          STUDENTS.forEach(name => {

            const status =
              report.attendance?.[name] ||
              "Not marked";


            const z =
              report.weeklyZikir?.[name]
                ? "Done"
                : "Not done";


            html +=

              '<div class="report-line">' +

              "<b>" +
              escapeHtml(name) +
              "</b>: " +

              escapeHtml(status) +

              " | Weekly Dhikr: " +

              escapeHtml(z) +

              "</div>";


            const qp =
              report.quranPlans?.[name];


            if(qp?.currentSurah){

              html +=

                '<div class="report-line">' +

                "　" +

                escapeHtml(
                  quranSummary(qp)
                ) +

                "</div>";

            }


            if(name === "Arefat"){

              const kp =
                report.kitabPlans?.Arefat;


              if(kp?.initialFasl){

                html +=

                  '<div class="report-line">' +

                  "　" +

                  escapeHtml(
                    kitabSummary(kp)
                  ) +

                  "</div>";

              }

            }

          });


          card.innerHTML =
            html;


          list.appendChild(card);

        }
      );


  }catch(e){

    list.innerHTML =
      '<div class="empty-msg">' +
      'Error: ' +
      escapeHtml(e.message) +
      '</div>';

  }

}


function setup(){

  document
    .getElementById("attDate")
    .value =
      getTodayStr();


  if(isController){

    document
      .getElementById("pageTitle")
      .textContent =
        "📨 Controller Dashboard";


    document
      .getElementById("pageSubtitle")
      .textContent =
        "📋 Reports sent from the attendance website";


    document
      .getElementById("dateSection")
      .style.display =
        "none";


    document
      .getElementById("studentList")
      .style.display =
        "none";


    document
      .getElementById("mainActions")
      .style.display =
        "none";


    document
      .getElementById("historySection")
      .style.display =
        "none";


    document
      .getElementById("controllerSection")
      .style.display =
        "block";


    loadControllerReports();


  }else{

    document
      .getElementById("attDate")
      .addEventListener(
        "change",
        () =>
          loadFromFirebase(
            document
              .getElementById("attDate")
              .value
          )
      );


    document
      .getElementById("saveAllBtn")
      .onclick =
        saveAllAttendance;


    document
      .getElementById("saveAllPlansBtn")
      .onclick =
        saveAllQuranPlans;


    document
      .getElementById("loadBtn")
      .onclick =
        () =>
          loadFromFirebase(
            document
              .getElementById("attDate")
              .value
          );


    document
      .getElementById("shareBtn")
      .onclick =
        shareReport;


    document
      .getElementById("sendControllerBtn")
      .onclick =
        sendToController;


    renderStudents();


    Promise.all([

      loadFromFirebase(
        getTodayStr()
      ),

      loadHistory()

    ]).catch(e => {

      showStatus(
        "❌ " +
        e.message,
        "error"
      );

    });

  }


  db.ref(".info/connected")
    .on(
      "value",
      snap => {

        const el =
          document.getElementById(
            "syncStatus"
          );


        if(!el)
          return;


        if(snap.val()){

          el.textContent =
            "🟢 Firebase connected";

          el.className =
            "sync-status online";

        }else{

          el.textContent =
            "🔴 Firebase offline";

          el.className =
            "sync-status offline";

        }

      }
    );

}


document.addEventListener(
  "DOMContentLoaded",
  setup
);

</script>
