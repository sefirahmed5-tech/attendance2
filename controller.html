function buildFaslOptions(selectedValue = "") {
    let html =
        '<option value="">-- اختر الفصل --</option>';

    KITAB_FASLS.forEach((fasl, index) => {

        const value = String(index + 1);

        const selected =
            String(selectedValue) === value
                ? " selected"
                : "";

        html +=
            `<option value="${value}"${selected}>${fasl}</option>`;
    });

    return html;
}

function getFaslName(number) {

    const index =
        Number(number) - 1;

    if (
        index < 0 ||
        index >= KITAB_FASLS.length
    ) {
        return "";
    }

    return KITAB_FASLS[index];
}

function validateKitabRange(start, end) {

    const startNum = Number(start);
    const endNum = Number(end);

    if (!startNum || !endNum) {
        return false;
    }

    return endNum >= startNum;
}

async function loadKitabPlans() {

    try {

        const snapshot =
            await db.ref("kitabPlans").once("value");

        const data =
            snapshot.val() || {};

        currentKitabPlans =
            data || {};

        return currentKitabPlans;

    } catch (error) {

        console.error(
            "Error loading Kitab plans:",
            error
        );

        currentKitabPlans = {};

        return {};
    }
}

async function saveArefatKitabPlan() {

    const startSelect =
        document.getElementById(
            "kitabStartFasl-Arefat"
        );

    const endSelect =
        document.getElementById(
            "kitabEndFasl-Arefat"
        );

    if (!startSelect || !endSelect) {

        showStatus(
            "⚠️ Arefat's Kitab plan fields were not found.",
            "error"
        );

        return;
    }

    const start =
        startSelect.value;

    const end =
        endSelect.value;

    if (!start || !end) {

        showStatus(
            "⚠️ Please select both the initial and final Fasl.",
            "error"
        );

        return;
    }

    if (!validateKitabRange(start, end)) {

        showStatus(
            "⚠️ The final Fasl must be the same as or after the initial Fasl.",
            "error"
        );

        return;
    }

    const button =
        document.getElementById(
            "saveKitabPlanBtn-Arefat"
        );

    if (button) {
        button.disabled = true;
        button.textContent = "Saving...";
    }

    try {

        const plan = {

            student: "Arefat",

            book: "Safinat an-Naja",

            startFasl: Number(start),

            startFaslName:
                getFaslName(start),

            endFasl: Number(end),

            endFaslName:
                getFaslName(end),

            updatedAt:
                firebase.database.ServerValue.TIMESTAMP
        };

        await db
            .ref("kitabPlans/Arefat")
            .set(plan);

        currentKitabPlans.Arefat =
            plan;

        showStatus(
            "📚 Arefat's Safinat an-Naja plan was saved!",
            "success"
        );

    } catch (error) {

        console.error(
            "Error saving Arefat Kitab plan:",
            error
        );

        showStatus(
            "❌ Error saving Kitab plan: " +
            error.message,
            "error"
        );

    } finally {

        if (button) {
            button.disabled = false;
            button.textContent =
                "📚 Save Kitab Plan";
        }
    }
}

function populateSurahSelect(selectElement, selectedValue) {

    if (!selectElement) return;

    selectElement.innerHTML =
        '<option value="">-- Select Surah --</option>';

    SURAHS.forEach((surah) => {

        const option =
            document.createElement("option");

        option.value = surah;
        option.textContent = surah;

        if (surah === selectedValue) {
            option.selected = true;
        }

        selectElement.appendChild(option);
    });
}

function populatePageSelect(selectElement, selectedValue) {

    if (!selectElement) return;

    selectElement.innerHTML =
        '<option value="">-- Page --</option>';

    PAGES.forEach((page) => {

        const option =
            document.createElement("option");

        option.value = page;
        option.textContent = page;

        if (Number(selectedValue) === page) {
            option.selected = true;
        }

        selectElement.appendChild(option);
    });
}

        attendanceButtons += `
            <button
                type="button"
                class="opt-btn ${option.key}${active}"
                data-student="${name}"
                data-status="${option.key}"
            >
                ${option.label}
            </button>
        `;
    });

    const currentSurah =
        plan.currentSurah || "";

    const currentPage =
        plan.currentPage || "";

    const targetSurah =
        plan.targetSurah || "";

    const targetPage =
        plan.targetPage || "";

    card.innerHTML = `

        <div class="student-name">

            <span>${name}</span>

            <span
                class="student-status-badge ${statusClass}"
                id="status-badge-${name}"
            >
                ${statusText}
            </span>

        </div>

        <div class="options">

            ${attendanceButtons}

        </div>

        <div class="zikir-row">

            <button
                type="button"
                class="zikir-btn ${zikir ? "active" : ""}"
                id="zikirBtn-${name}"
                data-student="${name}"
            >
                ${zikir
                    ? "✅ Weekly Zikir: Done"
                    : "📿 Weekly Zikir: Not Done"}
            </button>

        </div>

        <div class="quran-plan">

            <div class="quran-plan-title">
                📖 15-Day Quran Plan
            </div>

            <label class="plan-label">
                Current Surah
            </label>

            <div class="plan-row">

                <select
                    id="currentSurah-${name}"
                >
                </select>

            </div>

            <label class="plan-label">
                Current Page
            </label>

            <div class="plan-row">

                <select
                    id="currentPage-${name}"
                >
                </select>

            </div>

            <label class="plan-label">
                Target Surah
            </label>

            <div class="plan-row">

                <select
                    id="targetSurah-${name}"
                >
                </select>

            </div>

            <label class="plan-label">
                Target Page
            </label>

            <div class="plan-row">

                <select
                    id="targetPage-${name}"
                >
                </select>

            </div>

            <div class="student-actions">

                <button
                    type="button"
                    class="save-student-btn plan"
                    id="savePlanBtn-${name}"
                >
                    📖 Save Quran Plan
                </button>

            </div>

        </div>

        ${
            name === "Arefat"
            ? `
            <div class="kitab-plan">

                <div class="kitab-plan-title">
                    📚 15-Day Kitab Plan — Safinat an-Naja
                </div>

                <label class="plan-label">
                    Initial Fasl
                </label>

                <div class="plan-row">

                    <select
                        id="kitabStartFasl-Arefat"
                    >
                        ${buildFaslOptions(
                            kitabPlan.startFasl || ""
                        )}
                    </select>

                </div>

                <label class="plan-label">
                    Final Fasl
                </label>

                <div class="plan-row">

                    <select
                        id="kitabEndFasl-Arefat"
                    >
                        ${buildFaslOptions(
                            kitabPlan.endFasl || ""
                        )}
                    </select>

                </div>

                <div class="student-actions">

                    <button
                        type="button"
                        class="save-student-btn kitab"
                        id="saveKitabPlanBtn-Arefat"
                    >
                        📚 Save Kitab Plan
                    </button>

                </div>

            </div>
            `
            : ""
        }

        <div class="student-actions">

            <button
                type="button"
                class="save-student-btn attendance"
                id="saveAttBtn-${name}"
            >
                💾 Save Attendance
            </button>

        </div>
    `;

    const currentSurahSelect =
        card.querySelector(
            "#currentSurah-" + name
        );

    const currentPageSelect =
        card.querySelector(
            "#currentPage-" + name
        );

    const targetSurahSelect =
        card.querySelector(
            "#targetSurah-" + name
        );

    const targetPageSelect =
        card.querySelector(
            "#targetPage-" + name
        );

    populateSurahSelect(
        currentSurahSelect,
        currentSurah
    );

    populatePageSelect(
        currentPageSelect,
        currentPage
    );

    populateSurahSelect(
        targetSurahSelect,
        targetSurah
    );

    populatePageSelect(
        targetPageSelect,
        targetPage
    );

    return card;
}

function renderStudents() {

    const container =
        document.getElementById("studentList");

    if (!container) return;

    container.innerHTML = "";

    STUDENTS.forEach(name => {

        const card =
            createStudentCard(name);

        container.appendChild(card);
    });

    attachStudentEventListeners();
}

function attachStudentEventListeners() {

    document
        .querySelectorAll(".opt-btn")
        .forEach(button => {

            button.addEventListener(
                "click",
                function() {

                    const name =
                        this.dataset.student;

                    const status =
                        this.dataset.status;

                    currentAttendance[name] =
                        status;

                    const card =
                        document.getElementById(
                            "student-card-" + name
                        );

                    if (card) {

                        card
                            .querySelectorAll(".opt-btn")
                            .forEach(btn => {
                                btn.classList.remove(
                                    "active"
                                );
                            });

                        this.classList.add("active");
                    }

                    updateStudentStatusBadge(
                        name
                    );
                }
            );
        });

    document
        .querySelectorAll(".zikir-btn")
        .forEach(button => {

            button.addEventListener(
                "click",
                function() {

                    const name =
                        this.dataset.student;

                    currentZikir[name] =
                        !currentZikir[name];

                    this.classList.toggle(
                        "active",
                        currentZikir[name]
                    );

                    this.textContent =
                        currentZikir[name]
                            ? "✅ Weekly Zikir: Done"
                            : "📿 Weekly Zikir: Not Done";
                }
            );
        });

    STUDENTS.forEach(name => {

        const saveAttendanceBtn =
            document.getElementById(
                "saveAttBtn-" + name
            );

        if (saveAttendanceBtn) {

            saveAttendanceBtn.addEventListener(
                "click",
                async () => {

                    const date =
                        document.getElementById(
                            "attDate"
                        ).value;

                    if (!date) {

                        showStatus(
                            "⚠️ Please select a date first.",
                            "error"
                        );

                        return;
                    }

                    await saveStudentAttendance(
                        name,
                        date
                    );
                }
            );
        }

        const savePlanBtn =
            document.getElementById(
                "savePlanBtn-" + name
            );

        if (savePlanBtn) {

            savePlanBtn.addEventListener(
                "click",
                async () => {

                    await saveStudentQuranPlan(
                        name
                    );
                }
            );
        }
    });

    const kitabButton =
        document.getElementById(
            "saveKitabPlanBtn-Arefat"
        );

    if (kitabButton) {

        kitabButton.addEventListener(
            "click",
            async () => {

                await saveArefatKitabPlan();

            }
        );
    }
}

function updateStudentStatusBadge(name) {

    const badge =
        document.getElementById(
            "status-badge-" + name
        );

    if (!badge) return;

    const status =
        currentAttendance[name];

    badge.classList.remove(
        "saved",
        "partial"
    );

    if (!status) {

        badge.textContent =
            "Not saved";

        return;
    }

    badge.classList.add("saved");

    if (status === "present") {

        badge.textContent =
            "Present";

    } else if (status === "absent") {

        badge.textContent =
            "Absent";

    } else if (status === "permission") {

        badge.textContent =
            "Permission";
    }
}

function updateAllStudentStatusBadges() {

    STUDENTS.forEach(name => {

        updateStudentStatusBadge(
            name
        );
    });
}

async function loadAttendance(dateKey) {

    try {

        const snapshot =
            await db
                .ref("attendance/" + dateKey)
                .once("value");

        const data =
            snapshot.val();

        if (!data) {

            currentAttendance = {};
            currentZikir = {};

            return null;
        }

        currentAttendance =
            data.records || {};

        currentZikir =
            data.weeklyZikir || {};

        return data;

    } catch (error) {

        console.error(
            "Error loading attendance:",
            error
        );

        showStatus(
            "❌ Error loading attendance: " +
            error.message,
            "error"
        );

        return null;
    }
}

async function loadFromFirebase() {

    const dateInput =
        document.getElementById("attDate");

    const dateKey =
        dateInput.value;

    if (!dateKey) {

        showStatus(
            "⚠️ Please select a date first.",
            "error"
        );

        return;
    }

    showStatus(
        "🔄 Loading data...",
        "loading"
    );

    try {

        await loadAttendance(
            dateKey
        );

        await loadQuranPlans();

        await loadKitabPlans();

        renderStudents();

        await loadHistory();

        showStatus(
            "✅ Data loaded successfully.",
            "success"
        );

    } catch (error) {

        console.error(
            "Error loading data:",
            error
        );

        showStatus(
            "❌ Error loading data: " +
            error.message,
            "error"
        );
    }
}async function saveAllAttendance() {

    const dateKey =
        document.getElementById("attDate").value;

    if (!dateKey) {

        showStatus(
            "⚠️ Please select a date first.",
            "error"
        );

        return;
    }

    const missing =
        STUDENTS.filter(
            name => !currentAttendance[name]
        );

    if (missing.length > 0) {

        showStatus(
            "⚠️ Please select attendance for: " +
            missing.join(", "),
            "error"
        );

        return;
    }

    const button =
        document.getElementById("saveAllBtn");

    button.disabled = true;
    button.textContent = "Saving...";

    try {

        await db
            .ref("attendance/" + dateKey)
            .set({

                date: dateKey,

                records:
                    currentAttendance,

                weeklyZikir:
                    currentZikir,

                timestamp:
                    firebase.database.ServerValue.TIMESTAMP
            });

        showStatus(
            "✅ All attendance saved successfully!",
            "success"
        );

        await loadHistory();

        updateAllStudentStatusBadges();

    } catch (error) {

        console.error(
            "Error saving all attendance:",
            error
        );

        showStatus(
            "❌ Error saving attendance: " +
            error.message,
            "error"
        );

    } finally {

        button.disabled = false;
        button.textContent =
            "💾 Save All Attendance";
    }
}

async function saveAllQuranPlans() {

    const button =
        document.getElementById(
            "saveAllPlansBtn"
        );

    button.disabled = true;
    button.textContent = "Saving...";

    try {

        let count = 0;

        for (const name of STUDENTS) {

            const currentSurah =
                document.getElementById(
                    "currentSurah-" + name
                );

            const currentPage =
                document.getElementById(
                    "currentPage-" + name
                );

            const targetSurah =
                document.getElementById(
                    "targetSurah-" + name
                );

            const targetPage =
                document.getElementById(
                    "targetPage-" + name
                );

            if (
                !currentSurah ||
                !currentPage ||
                !targetSurah ||
                !targetPage
            ) {
                continue;
            }

            if (
                !currentSurah.value ||
                !currentPage.value ||
                !targetSurah.value ||
                !targetPage.value
            ) {
                continue;
            }

            const plan = {

                currentSurah:
                    currentSurah.value,

                currentPage:
                    Number(currentPage.value),

                targetSurah:
                    targetSurah.value,

                targetPage:
                    Number(targetPage.value),

                updatedAt:
                    firebase.database.ServerValue.TIMESTAMP
            };

            await db
                .ref("quranPlans/" + name)
                .set(plan);

            currentQuranPlans[name] =
                plan;

            count++;
        }

        showStatus(
            `✅ ${count} Quran plan(s) saved!`,
            "success"
        );

    } catch (error) {

        console.error(
            "Error saving Quran plans:",
            error
        );

        showStatus(
            "❌ Error saving Quran plans: " +
            error.message,
            "error"
        );

    } finally {

        button.disabled = false;
        button.textContent =
            "📖 Save All Plans";
    }
}

function generateReportText() {

    const date =
        document.getElementById("attDate").value;

    let report =
        "📋 Quran Attendance Report\n";

    report +=
        "📅 Date: " +
        (date || "No date selected") +
        "\n\n";

    STUDENTS.forEach(name => {

        const status =
            currentAttendance[name] ||
            "Not selected";

        const zikir =
            currentZikir[name]
                ? "✅ Done"
                : "❌ Not Done";

        report +=
            `👤 ${name}\n`;

        report +=
            `Attendance: ${status}\n`;

        report +=
            `Weekly Zikir: ${zikir}\n`;

        const plan =
            getCurrentPlan(name);

        if (
            plan.currentSurah &&
            plan.currentPage &&
            plan.targetSurah &&
            plan.targetPage
        ) {

            report +=
                `📖 Quran Plan: ${plan.currentSurah}, Page ${plan.currentPage}` +
                ` → ${plan.targetSurah}, Page ${plan.targetPage}\n`;
        }

        if (name === "Arefat") {

            const kitab =
                getCurrentKitabPlan("Arefat");

            if (
                kitab.startFasl &&
                kitab.endFasl
            ) {

                report +=
                    `📚 Kitab Plan: Safinat an-Naja\n`;

                report +=
                    `Initial Fasl: ${kitab.startFaslName || getFaslName(kitab.startFasl)}\n`;

                report +=
                    `Final Fasl: ${kitab.endFaslName || getFaslName(kitab.endFasl)}\n`;
            }
        }

        report += "\n";
    });

    return report;
}

function showReport() {

    const report =
        generateReportText();

    let reportBox =
        document.getElementById(
            "reportBox"
        );

    if (!reportBox) {

        reportBox =
            document.createElement("pre");

        reportBox.id =
            "reportBox";

        reportBox.style.whiteSpace =
            "pre-wrap";

        reportBox.style.background =
            "#f5f5f5";

        reportBox.style.padding =
            "15px";

        reportBox.style.borderRadius =
            "8px";

        reportBox.style.marginTop =
            "15px";

        document
            .querySelector(".actions")
            .after(reportBox);
    }

    reportBox.textContent =
        report;

    reportBox.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
    });

    return report;
}

async function sendReport() {

    const report =
        generateReportText();

    if (
        navigator.share
    ) {

        try {

            await navigator.share({

                title:
                    "Quran Attendance Report",

                text:
                    report
            });

            return;

        } catch (error) {

            if (
                error.name ===
                "AbortError"
            ) {
                return;
            }
        }
    }

    try {

        await navigator.clipboard.writeText(
            report
        );

        showStatus(
            "📋 Report copied to clipboard!",
            "success"
        );

    } catch (error) {

        showReport();

        showStatus(
            "📋 Report displayed below.",
            "info"
        );
    }
}

async function sendToController() {

    const date =
        document.getElementById(
            "attDate"
        ).value;

    if (!date) {

        showStatus(
            "⚠️ Please select a date first.",
            "error"
        );

        return;
    }

    const report =
        generateReportText();

    try {

        await db
            .ref(
                "controllerReports/" +
                date
            )
            .set({

                date: date,

                report: report,

                timestamp:
                    firebase.database.ServerValue.TIMESTAMP
            });

        showStatus(
            "📡 Report sent to Controller!",
            "success"
        );

    } catch (error) {

        console.error(
            "Error sending controller report:",
            error
        );

        showStatus(
            "❌ Error sending report: " +
            error.message,
            "error"
        );
    }
}

async function loadHistory() {

    const historyList =
        document.getElementById(
            "historyList"
        );

    if (!historyList) return;

    try {

        const snapshot =
            await db
                .ref("attendance")
                .once("value");

        const data =
            snapshot.val();

        if (!data) {

            historyList.innerHTML =
                '<div class="empty-msg">No attendance records yet.</div>';

            return;
        }

        const dates =
            Object.keys(data)
                .sort()
                .reverse();

        if (dates.length === 0) {

            historyList.innerHTML =
                '<div class="empty-msg">No attendance records yet.</div>';

            return;
        }

        historyList.innerHTML = "";

        dates.forEach(date => {

            const record =
                data[date] || {};

            const records =
                record.records || {};

            const present =
                Object.values(records)
                    .filter(
                        value =>
                            value === "present"
                    ).length;

            const absent =
                Object.values(records)
                    .filter(
                        value =>
                            value === "absent"
                    ).length;

            const permission =
                Object.values(records)
                    .filter(
                        value =>
                            value === "permission"
                    ).length;

            const item =
                document.createElement("div");

            item.className =
                "history-item";

            item.innerHTML = `

                <span class="date">
                    📅 ${date}
                </span>

                <span class="summary">
                    ✅ ${present}
                    &nbsp;
                    ❌ ${absent}
                    &nbsp;
                    📝 ${permission}
                </span>

            `;

            item.addEventListener(
                "click",
                async () => {

                    document
                        .getElementById(
                            "attDate"
                        )
                        .value = date;

                    await loadFromFirebase();
                }
            );

            historyList.appendChild(
                item
            );
        });

    } catch (error) {

        console.error(
            "Error loading history:",
            error
        );

        historyList.innerHTML =
            '<div class="empty-msg">Error loading history.</div>';
    }
}

function initializeDate() {

    const dateInput =
        document.getElementById(
            "attDate"
        );

    if (!dateInput.value) {

        dateInput.value =
            getTodayDate();
    }
}

function getTodayDate() {

    const now =
        new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            now.getDate()
        ).padStart(2, "0");

    return `${year}-${month}-${day}`;
}

document.addEventListener(
    "DOMContentLoaded",
    async () => {

        initializeDate();

        renderStudents();

        await checkConnection();

        await loadFromFirebase();

        document
            .getElementById(
                "saveAllBtn"
            )
            .addEventListener(
                "click",
                saveAllAttendance
            );

        document
            .getElementById(
                "saveAllPlansBtn"
            )
            .addEventListener(
                "click",
                saveAllQuranPlans
            );

        document
            .getElementById(
                "loadBtn"
            )
            .addEventListener(
                "click",
                loadFromFirebase
            );

        document
            .getElementById(
                "shareBtn"
            )
            .addEventListener(
                "click",
                sendReport
            );

        setInterval(
            checkConnection,
            10000
        );
    }
);

</script>
