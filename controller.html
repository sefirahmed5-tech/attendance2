<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>👨‍💼 Controller - Attendance</title>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    padding: 15px;
    max-width: 850px;
    margin: auto;
}

.container {
    background: white;
    border-radius: 16px;
    padding: 22px;
    box-shadow: 0 2px 10px rgba(0,0,0,.1);
}

h1 {
    color: #1a237e;
    font-size: 25px;
    margin-bottom: 5px;
}

.subtitle {
    color: #666;
    font-size: 14px;
    margin-bottom: 20px;
}

.date-panel {
    background: #e8eaf6;
    padding: 15px;
    border-radius: 11px;
    margin-bottom: 15px;
}

.date-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

.date-row label {
    font-weight: bold;
    color: #1a237e;
}

.date-row input {
    padding: 9px 10px;
    border: 1px solid #bbb;
    border-radius: 7px;
    background: white;
}

.date-buttons {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

.date-buttons button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.previous-btn {
    background: #757575;
    color: white;
}

.today-btn {
    background: #546e7a;
    color: white;
}

.load-btn {
    width: 100%;
    margin-top: 10px;
    padding: 13px;
    border: none;
    border-radius: 9px;
    background: #1a237e;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.load-btn:hover {
    background: #0d1652;
}

.report-actions {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.report-actions button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 9px;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
}

.share-btn {
    background: #0088cc;
    color: white;
}

.text-btn {
    background: #00897b;
    color: white;
}

.status {
    margin: 12px 0;
    padding: 10px;
    border-radius: 8px;
    text-align: center;
    font-size: 14px;
}

.status.info {
    background: #e3f2fd;
    color: #0d47a1;
}

.status.success {
    background: #e8f5e9;
    color: #2e7d32;
}

.status.error {
    background: #ffebee;
    color: #c62828;
}

.status.loading {
    background: #fff3e0;
    color: #e65100;
}

.summary {
    background: #e8eaf6;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 18px;
    text-align: center;
    color: #333;
    line-height: 1.7;
}

.summary strong {
    color: #1a237e;
}

.student-card {
    background: #f8f9fa;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
}

.student-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
}

.student-name {
    font-size: 19px;
    font-weight: bold;
    color: #1a237e;
}

.attendance {
    font-weight: bold;
}

.present {
    color: #2e7d32;
}

.absent {
    color: #c62828;
}

.permission {
    color: #ef6c00;
}

.unmarked {
    color: #999;
}

.info-box {
    background: white;
    border: 1px solid #ddd;
    border-radius: 9px;
    padding: 12px;
    margin-top: 10px;
}

.info-title {
    font-weight: bold;
    color: #555;
    margin-bottom: 6px;
}

.zikir-done {
    color: #7b1fa2;
    font-weight: bold;
}

.zikir-not-done {
    color: #999;
}

.quran-box {
    background: #f5f0f8;
    border: 1px solid #ddd;
    border-radius: 9px;
    padding: 12px;
    margin-top: 10px;
}

.quran-title {
    font-weight: bold;
    color: #7b1fa2;
    margin-bottom: 8px;
}

.position {
    margin: 5px 0;
    line-height: 1.4;
}

.no-plan {
    color: #999;
}

.footer-note {
    margin-top: 20px;
    text-align: center;
    color: #999;
    font-size: 12px;
}

.empty {
    text-align: center;
    color: #999;
    padding: 30px 10px;
}

@media (max-width: 550px) {

    body {
        padding: 9px;
    }

    .container {
        padding: 15px;
    }

    .student-header {
        flex-direction: column;
        align-items: flex-start;
    }

    .report-actions {
        flex-direction: column;
    }

    .date-row {
        flex-direction: column;
        align-items: stretch;
    }

    .date-row input {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>👨‍💼 Controller Attendance</h1>

<p class="subtitle">
View today's attendance, previous attendance records, and current Quran plans.
</p>

<div class="date-panel">

    <div class="date-row">

        <label for="date">📅 Attendance Date:</label>

        <input type="date" id="date">

    </div>

    <div class="date-buttons">

        <button class="previous-btn" id="previousBtn">
            ⬅️ Previous Day
        </button>

        <button class="today-btn" id="todayBtn">
            📅 Today
        </button>

    </div>

    <button class="load-btn" id="loadBtn">
        📥 Load Selected Date
    </button>

</div>

<div id="status" class="status info">
    Select a date and load the attendance.
</div>

<div class="report-actions">

    <button class="share-btn" id="shareBtn">
        📤 Send / Share Report
    </button>

    <button class="text-btn" id="saveTextBtn">
        💾 Save Report as Text
    </button>

</div>

<div id="summary" class="summary" style="display:none;"></div>

<div id="studentList">

    <div class="empty">
        No attendance loaded yet.
    </div>

</div>

<div class="footer-note">
    Attendance is loaded from the shared Firebase database.
</div>

</div>

<script>

const DATABASE_URL =
"https://attendance-e6719-default-rtdb.firebaseio.com/";

const firebaseConfig = {
    databaseURL: DATABASE_URL
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

const STUDENTS = [
    "Arefat",
    "Zahra",
    "Suzanne",
    "Rania",
    "Hafsah"
];

let currentRecords = {};
let currentZikir = {};
let currentPlans = {};
let currentDate = "";

function getTodayStr() {

    const d = new Date();

    return d.getFullYear() + "-" +
        String(d.getMonth() + 1).padStart(2, "0") + "-" +
        String(d.getDate()).padStart(2, "0");
}

function changeDateByDays(days) {

    const input = document.getElementById("date");

    if (!input.value) {
        input.value = getTodayStr();
    }

    const parts = input.value.split("-");

    const d = new Date(
        Number(parts[0]),
        Number(parts[1]) - 1,
        Number(parts[2])
    );

    d.setDate(d.getDate() + days);

    input.value =
        d.getFullYear() + "-" +
        String(d.getMonth() + 1).padStart(2, "0") + "-" +
        String(d.getDate()).padStart(2, "0");
}

function showStatus(message, type = "info") {

    const el = document.getElementById("status");

    el.className = "status " + type;

    el.textContent = message;
}

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function attendanceText(status) {

    if (status === "present") {
        return '<span class="present">✅ Present</span>';
    }

    if (status === "absent") {
        return '<span class="absent">❌ Absent</span>';
    }

    if (status === "permission") {
        return '<span class="permission">📝 Permission</span>';
    }

    return '<span class="unmarked">— Not marked</span>';
}

function renderStudents() {

    const list = document.getElementById("studentList");

    list.innerHTML = "";

    let present = 0;
    let absent = 0;
    let permission = 0;
    let unmarked = 0;

    STUDENTS.forEach(name => {

        const status = currentRecords[name];

        if (status === "present") {
            present++;
        } else if (status === "absent") {
            absent++;
        } else if (status === "permission") {
            permission++;
        } else {
            unmarked++;
        }

        const plan = currentPlans[name];

        let planHTML = "";

        if (
            plan &&
            plan.currentSurah &&
            plan.targetSurah
        ) {

            planHTML = `
                <div class="quran-box">

                    <div class="quran-title">
                        📖 Current 15-Day Quran Plan
                    </div>

                    <div class="position">
                        📍 <strong>Current:</strong>
                        ${escapeHTML(plan.currentSurah)}
                        — Page
                        ${escapeHTML(String(plan.currentPage))}
                    </div>

                    <div class="position">
                        🎯 <strong>Target:</strong>
                        ${escapeHTML(plan.targetSurah)}
                        — Page
                        ${escapeHTML(String(plan.targetPage))}
                    </div>

                </div>
            `;

        } else {

            planHTML = `
                <div class="quran-box">

                    <div class="quran-title">
                        📖 Current 15-Day Quran Plan
                    </div>

                    <div class="no-plan">
                        — No Quran plan saved
                    </div>

                </div>
            `;
        }

        const zikirHTML =
            currentZikir[name]
            ? '<span class="zikir-done">🕌 Weekly Zikir: Done</span>'
            : '<span class="zikir-not-done">🕌 Weekly Zikir: Not marked</span>';

        const card = document.createElement("div");

        card.className = "student-card";

        card.innerHTML = `

            <div class="student-header">

                <div class="student-name">
                    ${escapeHTML(name)}
                </div>

                <div class="attendance">
                    ${attendanceText(status)}
                </div>

            </div>

            <div class="info-box">

                <div class="info-title">
                    📋 Attendance
                </div>

                ${attendanceText(status)}

            </div>

            <div class="info-box">

                <div class="info-title">
                    🕌 Weekly Zikir
                </div>

                ${zikirHTML}

            </div>

            ${planHTML}

        `;

        list.appendChild(card);

    });

    const summary = document.getElementById("summary");

    summary.style.display = "block";

    summary.innerHTML = `

        <strong>
            📊 Attendance Summary — ${escapeHTML(currentDate)}
        </strong>

        <br>

        ✅ Present: ${present}
        &nbsp;&nbsp;|&nbsp;&nbsp;

        ❌ Absent: ${absent}
        &nbsp;&nbsp;|&nbsp;&nbsp;

        📝 Permission: ${permission}
        &nbsp;&nbsp;|&nbsp;&nbsp;

        — Unmarked: ${unmarked}

    `;
}

async function loadQuranPlans() {

    const snapshot =
        await db
        .ref("quranPlans")
        .once("value");

    currentPlans =
        snapshot.val() || {};
}

async function loadAttendance() {

    const dateKey =
        document.getElementById("date").value;

    if (!dateKey) {

        showStatus(
            "⚠️ Please select a date.",
            "error"
        );

        return;
    }

    currentDate = dateKey;

    showStatus(
        "📥 Loading data...",
        "loading"
    );

    try {

        const attendanceSnapshot =
            await db
            .ref("attendance/" + dateKey)
            .once("value");

        const attendanceData =
            attendanceSnapshot.val();

        if (attendanceData) {

            currentRecords =
                attendanceData.records || {};

            currentZikir =
                attendanceData.weeklyZikir || {};

        } else {

            currentRecords = {};
            currentZikir = {};
        }

        /*
         * Quran plans are not date-specific.
         * They remain visible every day until
         * changed by the attendance manager.
         */

        await loadQuranPlans();

        renderStudents();

        if (attendanceData) {

            showStatus(
                "✅ Attendance loaded for " + dateKey,
                "success"
            );

        } else {

            showStatus(
                "ℹ️ No attendance was saved for " +
                dateKey +
                ". Unmarked students are blank.",
                "info"
            );
        }

    } catch (error) {

        console.error(error);

        showStatus(
            "❌ Error loading data: " +
            error.message,
            "error"
        );
    }
}

function generateReportText() {

    const dateKey =
        currentDate ||
        document.getElementById("date").value;

    let text =
        "📋 ATTENDANCE REPORT\n";

    text +=
        "Date: " + dateKey + "\n";

    text +=
        "==============================\n\n";

    STUDENTS.forEach(name => {

        const status =
            currentRecords[name];

        let attendance =
            "Not marked";

        if (status === "present") {
            attendance = "Present";
        } else if (status === "absent") {
            attendance = "Absent";
        } else if (status === "permission") {
            attendance = "Permission";
        }

        const zikir =
            currentZikir[name]
            ? "Done"
            : "Not marked";

        text += name + "\n";

        text +=
            "Attendance: " +
            attendance +
            "\n";

        text +=
            "Weekly Zikir: " +
            zikir +
            "\n";

        const plan =
            currentPlans[name];

        if (
            plan &&
            plan.currentSurah &&
            plan.targetSurah
        ) {

            text +=
                "Quran Plan:\n";

            text +=
                "Current: " +
                plan.currentSurah +
                " - Page " +
                plan.currentPage +
                "\n";

            text +=
                "Target: " +
                plan.targetSurah +
                " - Page " +
                plan.targetPage +
                "\n";

        } else {

            text +=
                "Quran Plan: No plan saved\n";
        }

        text +=
            "\n------------------------------\n\n";
    });

    return text;
}

async function shareReport() {

    const text =
        generateReportText();

    if (navigator.share) {

        try {

            await navigator.share({

                title:
                    "Attendance Report - " +
                    currentDate,

                text: text

            });

            showStatus(
                "📤 Report shared successfully!",
                "success"
            );

        } catch (error) {

            if (error.name !== "AbortError") {

                showStatus(
                    "❌ Could not share report.",
                    "error"
                );
            }
        }

    } else {

        try {

            await navigator.clipboard.writeText(text);

            showStatus(
                "📋 Report copied to clipboard. You can paste it into WhatsApp or another app.",
                "success"
            );

        } catch (error) {

            showStatus(
                "⚠️ Sharing is not supported on this browser.",
                "error"
            );
        }
    }
}

function saveReportAsText() {

    const text =
        generateReportText();

    const blob =
        new Blob(
            [text],
            {
                type: "text/plain;charset=utf-8"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href = url;

    link.download =
        "Attendance-" +
        (currentDate || "Report") +
        ".txt";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);

    showStatus(
        "💾 Report saved as a text file.",
        "success"
    );
}

document
.getElementById("loadBtn")
.addEventListener(
    "click",
    loadAttendance
);

document
.getElementById("previousBtn")
.addEventListener(
    "click",
    () => {

        changeDateByDays(-1);

        loadAttendance();
    }
);

document
.getElementById("todayBtn")
.addEventListener(
    "click",
    () => {

        document.getElementById("date").value =
            getTodayStr();

        loadAttendance();
    }
);

document
.getElementById("shareBtn")
.addEventListener(
    "click",
    shareReport
);

document
.getElementById("saveTextBtn")
.addEventListener(
    "click",
    saveReportAsText
);

document.addEventListener(
    "DOMContentLoaded",
    () => {

        document.getElementById("date").value =
            getTodayStr();

    }
);

</script>

</body>
</html>
